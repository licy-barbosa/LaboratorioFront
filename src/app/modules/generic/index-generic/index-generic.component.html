 <h2>{{title}}</h2>

<button mat-flat-button routerLink="{{newRoute}}">Agregar</button>

<app-list-generic [list]="items">
    <ng-container contenido>
        <table mat-table [dataSource]="items" class="mat-elevation-z8 indice-elementos">
            
            @for (columna of showColumns; track $index) {
                @if (columna === 'acciones'){
                    <ng-container matColumnDef="acciones">
                        <th mat-header-cell *matHeaderCellDef>Acciones</th>
                        <td mat-cell *matCellDef="let elemento">
                            <a routerLink="{{editRout + '/' + elemento.id}}" mat-flat-button>Editar</a>
                            <button mat-flat-button color="warn" 
                            [swal]="{title: 'Confirmación', text:'¿Deseas borrar este registro?', showCancelButton: true}"
                            (confirm)="recordDelete(elemento.id)" 
                            >Borrar</button>
                        </td>
                    </ng-container>
                } @else {
                    <ng-container matColumnDef="{{columna}}">
                        <th mat-header-cell *matHeaderCellDef>{{columna}}</th>
                        <td mat-cell *matCellDef="let elemento">{{elemento[columna]}}</td>
                    </ng-container>
                }
            }

            <tr mat-header-row *matHeaderRowDef="showColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: showColumns"></tr> 
        </table>

        <mat-paginator showFirstLastButtons [length]="totalRecords" 
        [pageIndex]="paginationDto.pageNumber"
        [pageSize]="paginationDto.recordsPage"
        [pageSizeOptions]="[5, 10, 50]" class="mat-elevation-z8" (page)="onPageChange($event)"></mat-paginator>

    </ng-container>
</app-list-generic>
