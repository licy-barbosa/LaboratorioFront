<form (submit)="saveFormChanges()" [formGroup]="form">
    <mat-form-field appearance="outline" class="col-md-12 mb-4">
        <mat-label>Nombre</mat-label>
        <input matInput [formControl]="form.controls.nombre">
        <mat-error>{{getErrorsName()}}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="col-md-6 mb-4 pe-2">
        <mat-label>Genero</mat-label>
        <mat-select [formControl]="form.controls.generoid">
                <mat-option [value]="0">--Seleccione un género--</mat-option>
            @for (genero of generos; track $index) {
                <mat-option [value]="genero.generoId">{{genero.nameGenero}}</mat-option>
            }
        </mat-select>
    </mat-form-field>
    
    <mat-form-field appearance="outline" class="col-md-6 mb-4 ps-2">
        <mat-label>Edad</mat-label>
        <input matInput [formControl]="form.controls.edad">
    </mat-form-field> 

    <mat-form-field appearance="outline" class="col-md-6 mb-4 pe-2">
        <mat-label>NSS</mat-label>
        <input matInput [formControl]="form.controls.nss">
        <mat-error>{{getErrorsNSS()}}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="col-md-6 mb-4 ps-2">
        <mat-label>CURP</mat-label>
        <input matInput [formControl]="form.controls.curp">
        <mat-error>{{getErrorsCURP()}}</mat-error>
    </mat-form-field>

    <div>
        <button mat-flat-button type="submit" [disabled]="form.invalid" class="mx-1">Guardar</button>
        <a mat-stroked-button routerLink="/pacientes" class="mx-1">Cancelar</a>
    </div>
</form>
