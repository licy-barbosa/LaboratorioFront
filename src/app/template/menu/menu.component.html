<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" [routerLink]="'estudios'" routerLinkActive="active">My APP</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNavbar">
            <app-authentication>
                <ng-content authorized>
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" [routerLink]="'estudios'" routerLinkActive="active">Estudios</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" [routerLink]="'pacientes'" routerLinkActive="active">Pacientes</a>
                        </li>
                    </ul>
                </ng-content>
            </app-authentication>

            <app-authentication [rol]="'admin'">
                <ng-content authorized>
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" [routerLink]="'users'" routerLinkActive="active">Usuarios</a>
                        </li>
                    </ul>
                </ng-content>
            </app-authentication>

            <app-authentication class="d-flex align-items-center ms-auto mt-2 mt-lg-0">
                <ng-content authorized>
                    <small class="text-white fw-semibold me-2">Hello, {{securityService.getClaimValue('emailaddress')}}</small>
                    <img [src]="profileImage" alt="Perfil" class="rounded-circle border border-light text-white" width="40" height="40">
                    <a mat-button (click)="securityService.logout()" class="text-white">Logout</a>
                </ng-content>

                <ng-content noAuthorized>
                    <a mat-button routerLink="login" class="text-white">Login</a>
                    <a mat-button routerLink="register" class="text-white">Registro</a>
                </ng-content>
            </app-authentication>
        </div>
    </div>
</nav>
